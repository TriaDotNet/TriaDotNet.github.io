name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages has no server.mjs, so every page path gets its own copy of
      # index.html (and 404.html catches anything else).
      - name: Add page routes
        run: |
          for page in happy-birthday our-song my-favorite-moments love-coupons my-letter-to-you; do
            mkdir -p "dist/$page"
            cp dist/index.html "dist/$page/index.html"
          done
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
